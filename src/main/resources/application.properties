spring.application.name=content-calendar

# ---- Neon PostgreSQL, via Spring Boot's auto-configured HikariCP DataSource ----
# Spring Boot sees spring.datasource.* + HikariCP + the Postgres driver on the
# classpath and wires a HikariDataSource bean itself - nothing to write in Java.
# The ${VAR:default} syntax reads an env var if set, else falls back to the
# literal after the colon, e.g. for deploying with real secrets later.
#
# The postgresql:// URL Neon shows you is not a JDBC URL. Three changes:
#   1. prefix it with jdbc:
#   2. take the user and password out of the URL into their own properties
#   3. drop channel_binding - that is a psql option, the JDBC driver rejects it
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-super-heart-b7tzsx10.c-13.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_2iloTAup9FZn}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
